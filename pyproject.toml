[project]
name = "synthetic"
version = "0.1.0"
description = "Privacy-safe synthetic data: schema-first, reproducible, multi-table, with a Fidelity and Privacy Report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Rahul Bhandari" }]
dependencies = [
    "faker>=40.44.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sqlglot>=30.27.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
synthetic = "synthetic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
